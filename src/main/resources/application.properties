server.port=8080

# ---- MySQL ----
spring.datasource.url=jdbc:mysql://localhost:3306/hr_chatbot_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---- JWT ----
jwt.secret=${JWT_SECRET:change-this-to-a-long-random-secret-change-this-to-a-long-random-secret}
jwt.expiration-ms=86400000

# ---- LLM (Anthropic Messages API) ----
llm.api-key=${LLM_API_KEY:}
llm.api-url=https://api.groq.com/openai/v1/chat/completions
llm.model=llama-3.3-70b-versatile
llm.max-tokens=700
