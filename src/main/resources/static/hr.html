<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HR Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <h2>🗂️ HR Dashboard <a href="index.html">← Back to chat</a> <button class="action-btn" id="logout" style="margin-left:auto">Log out</button></h2>

    <h3>Pending leave requests</h3>
    <table>
      <thead><tr><th>#</th><th>Employee ID</th><th>Type</th><th>Dates</th><th>Days</th><th>Reason</th><th>Actions</th></tr></thead>
      <tbody id="leaveRows"><tr><td colspan="7">Loading...</td></tr></tbody>
    </table>

    <h3>Escalations</h3>
    <table>
      <thead><tr><th>#</th><th>Employee ID</th><th>Query</th><th>Status</th><th>Created</th><th>Actions</th></tr></thead>
      <tbody id="escRows"><tr><td colspan="6">Loading...</td></tr></tbody>
    </table>
  </div>
  <script src="hr.js"></script>
</body>
</html>
